interface:
  display_name: "vLLM Multimodal Evaluator"
  short_description: "Run multimodal capability checks with selective multi-transport coverage"
  default_prompt: "Use $vllm-multimodal-evaluator to generate deterministic image and video fixtures, verify Phase 1 ingestion and Phase 2 semantics with the default selective transport matrix, keep local_path/base64/http enabled by default for single-image, multi-image, and interleaved image understanding, expand to full transport coverage only when explicitly requested, and keep large-image smoke, 1~10 multi-video understanding, function-calling checks, and clear failure attribution separated."
